<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon suivi — MichelasTech</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0B0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .bar{max-width:760px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;}
  header.client{border-bottom:1px solid var(--line);background:var(--panel);}
  .signout{font-size:12.5px;color:var(--ink-soft);background:none;border:1px solid var(--line-strong);border-radius:6px;padding:7px 12px;cursor:pointer;}
  .signout:hover{border-color:var(--primary);}
  .wrap{max-width:760px;margin:0 auto;padding:32px 24px 80px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 28px;}
  .ticket{margin-bottom:20px;}
  .ticket-device{font-weight:600;font-size:15px;}
  .updated{font-size:11px;color:var(--ink-faint);margin-top:10px;}
  .empty{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:40px 24px;text-align:center;color:var(--ink-faint);font-size:13.5px;}
</style>
</head>
<body>
  <header class="client">
    <div class="bar">
      <a href="index.html" class="brand" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);">
        <img src="logo-icon.webp" alt="Logo MichelasTech" width="30" height="30">
        <div class="brand-name">Michelas<b style="color:var(--primary);">Tech</b></div>
      </a>
      <button class="signout" id="signOutBtn">Déconnexion</button>
    </div>
  </header>

  <div class="wrap">
    <h1>Mon suivi</h1>
    <p class="sub" id="whoAmI">Chargement…</p>
    <div id="list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    var STEPS = [
      {key:"depose", label:"Déposé"},
      {key:"diagnostique", label:"Diagnostiqué"},
      {key:"reparation", label:"Réparation"},
      {key:"pret", label:"Prêt"}
    ];
    var list = document.getElementById("list");

    auth.onAuthStateChanged(function(user){
      if(!user){ window.location.href = "login.html"; return; }
      if(user.email === ADMIN_EMAIL){ window.location.href = "admin.html"; return; }
      document.getElementById("whoAmI").textContent = "Connecté en tant que " + user.email;
      listenMyInterventions(user.email);
    });

    document.getElementById("signOutBtn").addEventListener("click", function(){ auth.signOut(); });

    function listenMyInterventions(email){
      db.collection("interventions").where("clientEmail", "==", email).onSnapshot(function(snap){
        if(snap.empty){
          list.innerHTML = '<div class="empty">Aucune intervention en cours pour le moment.</div>';
          return;
        }
        var docs = [];
        snap.forEach(function(doc){ docs.push(doc.data()); });
        docs.sort(function(a,b){ return (b.updatedAt && b.updatedAt.seconds || 0) - (a.updatedAt && a.updatedAt.seconds || 0); });
        list.innerHTML = "";
        docs.forEach(function(data){ list.appendChild(renderTicket(data)); });
      }, function(err){
        list.innerHTML = '<div class="empty">Impossible de charger vos dossiers pour le moment. (' + err.message + ')</div>';
        console.error(err);
      });
    }

    function renderTicket(data){
      var currentIndex = -1;
      STEPS.forEach(function(s, i){ if(s.key === data.status) currentIndex = i; });
      var wrap = document.createElement("div");
      wrap.className = "ticket";

      var top = document.createElement("div");
      top.className = "ticket-top";
      top.innerHTML = '<div><div class="field-label">Matériel</div><div class="ticket-device">' + escapeHtml(data.device || "") + '</div></div>';
      wrap.appendChild(top);

      var track = document.createElement("div");
      track.className = "status-track";
      STEPS.forEach(function(step, i){
        var el = document.createElement("div");
        el.className = "status-step" + (i < currentIndex ? " done" : i === currentIndex ? " active" : "");
        el.innerHTML = '<div class="status-line"></div><div class="status-dot"></div><div class="status-label">' + step.label + '</div>';
        track.appendChild(el);
      });
      wrap.appendChild(track);

      if(data.note){
        var note = document.createElement("div");
        note.className = "ticket-note";
        note.textContent = data.note;
        wrap.appendChild(note);
      }

      if(data.updatedAt){
        var updated = document.createElement("div");
        updated.className = "updated";
        var d = new Date(data.updatedAt.seconds * 1000);
        updated.textContent = "Mis à jour le " + d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
        wrap.appendChild(updated);
      }
      return wrap;
    }

    function escapeHtml(str){
      var div = document.createElement("div");
      div.innerText = str == null ? "" : str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
