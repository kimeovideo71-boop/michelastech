<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace client — MichelasTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16231F; --ink-soft:#48564F; --ink-faint:#8A9690;
    --paper:#EEF1EC; --panel:#FFFFFF;
    --primary:#1F5D50; --primary-dark:#153F37; --accent:#B8742A;
    --line:#C7CFC3; --line-strong:#9AA79E; --danger:#A6432E;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .mono{font-family:"IBM Plex Mono",monospace;}
  .box{
    width:100%;max-width:380px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--primary);
    border-radius:6px;padding:32px 28px;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;text-decoration:none;color:var(--ink);}
  .brand-mark{width:30px;height:30px;border-radius:6px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;}
  .brand-name{font-weight:600;font-size:15px;}
  h1{font-size:19px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--paper);border-radius:5px;padding:3px;}
  .tab{flex:1;text-align:center;padding:8px;font-size:13px;border-radius:4px;cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--panel);color:var(--ink);font-weight:600;border:1px solid var(--line);}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .form-row input{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:5px;background:var(--panel);color:var(--ink);}
  .form-row input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  button{width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:5px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;}
  button:hover{background:var(--primary-dark);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;margin-top:14px;padding:10px 12px;border-radius:5px;display:none;}
  .msg.error{display:block;background:color-mix(in srgb, var(--danger) 12%, transparent);color:var(--danger);}
  .msg.ok{display:block;background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary-dark);}
  .back{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--ink-faint);text-decoration:none;}
</style>
</head>
<body>
  <div class="box">
    <a href="index.html" class="brand">
      <div class="brand-mark">MT</div>
      <div class="brand-name">MichelasTech</div>
    </a>
    <h1>Espace client</h1>
    <p class="sub">Suivez l'état d'avancement de votre réparation.</p>

    <div class="tabs">
      <div class="tab active" id="tabLogin">Se connecter</div>
      <div class="tab" id="tabSignup">Créer un compte</div>
    </div>

    <form id="authForm">
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" id="submitBtn">Se connecter</button>
      <div class="msg" id="msg"></div>
    </form>

    <a href="index.html" class="back">← Retour au site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    let mode = "login";
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const submitBtn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    function setMode(m){
      mode = m;
      tabLogin.classList.toggle("active", m === "login");
      tabSignup.classList.toggle("active", m === "signup");
      submitBtn.textContent = m === "login" ? "Se connecter" : "Créer mon compte";
      msg.className = "msg";
    }
    tabLogin.addEventListener("click", () => setMode("login"));
    tabSignup.addEventListener("click", () => setMode("signup"));

    function showMsg(text, type){
      msg.textContent = text;
      msg.className = "msg " + type;
    }

    function routeForUser(user){
      if(user.email === ADMIN_EMAIL){
        window.location.href = "admin.html";
      } else {
        window.location.href = "client.html";
      }
    }

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      submitBtn.disabled = true;
      msg.className = "msg";
      try{
        let cred;
        if(mode === "login"){
          cred = await auth.signInWithEmailAndPassword(email, password);
        } else {
          cred = await auth.createUserWithEmailAndPassword(email, password);
        }
        routeForUser(cred.user);
      } catch(err){
        showMsg(friendlyError(err.code), "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    function friendlyError(code){
      const map = {
        "auth/invalid-email": "Adresse email invalide.",
        "auth/user-not-found": "Aucun compte avec cet email.",
        "auth/wrong-password": "Mot de passe incorrect.",
        "auth/email-already-in-use": "Un compte existe déjà avec cet email.",
        "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
        "auth/invalid-credential": "Email ou mot de passe incorrect."
      };
      return map[code] || "Une erreur est survenue. Réessayez.";
    }

    // Si déjà connecté, redirige automatiquement
    auth.onAuthStateChanged((user) => {
      if(user) routeForUser(user);
    });
  </script>
</body>
</html>
