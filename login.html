<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace client — MichelasTech</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0B0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:8px;padding:32px 28px;}
  .box .brand{margin-bottom:22px;}
  .box .brand img{width:30px;height:30px;}
  h1{font-size:19px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg);border-radius:6px;padding:3px;}
  .tab{flex:1;text-align:center;padding:8px;font-size:13px;border-radius:5px;cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--panel);color:var(--ink);font-weight:600;border:1px solid var(--line);}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .form-row input{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--ink);}
  .form-row input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  #submitBtn{width:100%;justify-content:center;}
  .msg{font-size:12.5px;margin-top:14px;padding:10px 12px;border-radius:6px;display:none;}
  .msg.error{display:block;background:rgba(255,107,91,.12);color:var(--danger);}
  .msg.ok{display:block;background:rgba(56,200,140,.12);color:var(--ok);}
  .back{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--ink-faint);text-decoration:none;}
  .back:hover{color:var(--primary-light);}
</style>
</head>
<body>
  <div class="box">
    <a href="index.html" class="brand" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);">
      <img src="logo-icon.webp" alt="Logo MichelasTech">
      <div class="brand-name">Michelas<b style="color:var(--primary);">Tech</b></div>
    </a>
    <h1>Espace client</h1>
    <p class="sub">Suivez l'état d'avancement de votre réparation.</p>

    <div class="tabs">
      <div class="tab active" id="tabLogin">Se connecter</div>
      <div class="tab" id="tabSignup">Créer un compte</div>
    </div>

    <form id="authForm">
      <div class="form-row">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" minlength="6">
      </div>
      <!-- Piège anti-spam pour les robots de création de compte -->
      <div class="hp-field" aria-hidden="true">
        <label for="company">Société</label>
        <input id="company" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary">Se connecter</button>
      <div class="msg" id="msg"></div>
    </form>

    <a href="index.html" class="back">← Retour au site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    var mode = "login";
    var tabLogin = document.getElementById("tabLogin");
    var tabSignup = document.getElementById("tabSignup");
    var submitBtn = document.getElementById("submitBtn");
    var msg = document.getElementById("msg");

    function setMode(m){
      mode = m;
      tabLogin.classList.toggle("active", m === "login");
      tabSignup.classList.toggle("active", m === "signup");
      submitBtn.textContent = m === "login" ? "Se connecter" : "Créer mon compte";
      msg.className = "msg";
    }
    tabLogin.addEventListener("click", function(){ setMode("login"); });
    tabSignup.addEventListener("click", function(){ setMode("signup"); });

    function showMsg(text, type){ msg.textContent = text; msg.className = "msg " + type; }

    function routeForUser(user){
      window.location.href = (user.email === ADMIN_EMAIL) ? "admin.html" : "client.html";
    }

    document.getElementById("authForm").addEventListener("submit", function(e){
      e.preventDefault();
      // Anti-spam : champ piège rempli -> robot, on ignore
      if(document.getElementById("company").value !== ""){ return; }

      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;
      submitBtn.disabled = true;
      msg.className = "msg";

      var action = mode === "login"
        ? auth.signInWithEmailAndPassword(email, password)
        : auth.createUserWithEmailAndPassword(email, password);

      action.then(function(cred){ routeForUser(cred.user); })
        .catch(function(err){ showMsg(friendlyError(err.code), "error"); })
        .finally(function(){ submitBtn.disabled = false; });
    });

    function friendlyError(code){
      var map = {
        "auth/invalid-email": "Adresse email invalide.",
        "auth/user-not-found": "Aucun compte avec cet email.",
        "auth/wrong-password": "Mot de passe incorrect.",
        "auth/email-already-in-use": "Un compte existe déjà avec cet email.",
        "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
        "auth/invalid-credential": "Email ou mot de passe incorrect.",
        "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.",
        "auth/network-request-failed": "Problème de connexion réseau."
      };
      return map[code] || ("Erreur : " + code);
    }

    auth.onAuthStateChanged(function(user){ if(user) routeForUser(user); });
  </script>
</body>
</html>
